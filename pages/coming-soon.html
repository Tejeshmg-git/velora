<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | Velora - System Activation</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@200,300,400,500,600,700&f[]=satoshi@300,400,500,600,700,900&display=swap" rel="stylesheet">
</head>
<body class="dark-mode coming-soon-page">
    
    <!-- Minimalist Nav -->
    <nav class="coming-soon-nav">
        <a href="../index.html" class="back-link">← Home</a>
        <div class="nav-controls" style="display: flex; gap: 15px; align-items: center;">
            <button id="rtl-toggle" class="btn-rtl" aria-label="Toggle RTL">RTL</button>
            <button id="theme-toggle" class="btn-theme" aria-label="Toggle Theme">
                <svg class="sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            </button>
        </div>
    </nav>

    <main class="terminal-container">
        <div class="terminal-content text-center">
            
            <div class="status-badge reveal-item">
                <span class="status-dot"></span>
                SYSTEM SEQUENCE INITIALIZING
            </div>

            <a href="../index.html" class="logo brand-logo reveal-item" style="margin-bottom: var(--space-2); margin-left: auto; margin-right: auto; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px;">
                <svg class="logo-icon-svg" viewBox="0 0 24 24" fill="currentColor" style="width: 32px; height: 32px;"><path d="m2 4 3 12h14l3-12-6 7-4-7-4 7-6-7z"></path></svg>
                <span class="logo-text">VELORA</span>
            </a>

            <h1 class="terminal-title reveal-text">Refining the <span class="text-gold">Elite Circle.</span></h1>
            
            <!-- Countdown Section -->
            <div class="countdown-grid reveal-item">
                <div class="countdown-card">
                    <span id="days" class="digit">00</span>
                    <span class="label">Days</span>
                </div>
                <div class="countdown-card">
                    <span id="hours" class="digit">00</span>
                    <span class="label">Hours</span>
                </div>
                <div class="countdown-card">
                    <span id="mins" class="digit">00</span>
                    <span class="label">Mins</span>
                </div>
                <div class="countdown-card">
                    <span id="secs" class="digit">00</span>
                    <span class="label">Secs</span>
                </div>
            </div>

            <!-- Calibration Bar -->
            <div class="calibration-section reveal-item">
                <div class="calibration-header">
                    <span class="calibration-label">ACCESS CALIBRATION</span>
                    <span class="calibration-percent">92%</span>
                </div>
                <div class="calibration-track">
                    <div class="calibration-fill" style="width: 92%;"></div>
                </div>
            </div>

            <!-- Waitlist Portal -->
            <div class="waitlist-portal reveal-item">
                <form class="waitlist-form">
                    <input type="email" placeholder="Enter your frequency (email)" required class="waitlist-input">
                    <button type="submit" class="btn btn-primary">Request Activation</button>
                </form>
                <p class="waitlist-note">You will be notified upon secure signal activation.</p>
            </div>

        </div>
    </main>

    <script>
        // RTL Toggle Logic
        const rtlToggle = document.getElementById('rtl-toggle');
        const body = document.body;

        function updateRTLText() {
            if (rtlToggle) {
                rtlToggle.innerText = document.documentElement.dir === 'rtl' ? 'LTR' : 'RTL';
            }
        }

        const savedRTL = localStorage.getItem('rtl') === 'true';
        if (savedRTL) {
            document.documentElement.setAttribute('dir', 'rtl');
            body.classList.add('rtl');
            updateRTLText();
        }

        if (rtlToggle) {
            rtlToggle.addEventListener('click', () => {
                if (document.documentElement.dir === 'rtl') {
                    document.documentElement.removeAttribute('dir');
                    body.classList.remove('rtl');
                    localStorage.setItem('rtl', 'false');
                } else {
                    document.documentElement.setAttribute('dir', 'rtl');
                    body.classList.add('rtl');
                    localStorage.setItem('rtl', 'true');
                }
                updateRTLText();
            });
        }

        // Theme Toggle Logic
        const themeToggle = document.getElementById('theme-toggle');
        const sunIcon = `<svg class="sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`;
        const moonIcon = `<svg class="moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`;

        function updateThemeIcon() {
            if (themeToggle) {
                themeToggle.innerHTML = body.classList.contains('dark-mode') ? sunIcon : moonIcon;
            }
        }

        const savedTheme = localStorage.getItem('theme') || 'dark-mode';
        body.classList.remove('dark-mode', 'light-mode');
        body.classList.add(savedTheme);
        updateThemeIcon();

        if (themeToggle) {
            themeToggle.addEventListener('click', () => {
                if (body.classList.contains('dark-mode')) {
                    body.classList.replace('dark-mode', 'light-mode');
                    localStorage.setItem('theme', 'light-mode');
                } else {
                    body.classList.replace('light-mode', 'dark-mode');
                    localStorage.setItem('theme', 'dark-mode');
                }
                updateThemeIcon();
            });
        }

        // Simple Countdown Logic for Coming Soon
        function updateCountdown() {
            const targetDate = new Date();
            targetDate.setDate(targetDate.getDate() + 44); // 44 Days from now

            function refresh() {
                const now = new Date().getTime();
                const diff = targetDate - now;

                if (diff < 0) return;

                const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diff % (1000 * 60)) / 1000);

                const daysEl = document.getElementById('days');
                const hoursEl = document.getElementById('hours');
                const minsEl = document.getElementById('mins');
                const secsEl = document.getElementById('secs');

                if (daysEl) daysEl.innerText = d.toString().padStart(2, '0');
                if (hoursEl) hoursEl.innerText = h.toString().padStart(2, '0');
                if (minsEl) minsEl.innerText = m.toString().padStart(2, '0');
                if (secsEl) secsEl.innerText = s.toString().padStart(2, '0');
            }
            
            refresh();
            setInterval(refresh, 1000);
        }
        updateCountdown();
    </script>
</body>
</html>
